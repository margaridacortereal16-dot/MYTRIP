<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toulouse Trip Guide 2026</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

  <div id="root"></div>

  <script>
    const e = React.createElement;

    // Dados da viagem
    const TRIP_METADATA = {
      title: "Toulouse Trip Guide 2026",
      subtitle: "Viagem à Cidade Rosa & Occitânia",
      startDate: "2026-10-01T17:00:00",
      endDate: "2026-10-04T22:30:00",
      flights: {
        outbound: {
          code: "FR1798",
          airline: "Ryanair",
          departure: "LIS 17:00",
          arrival: "TLS 19:50",
          date: "01/10/2026 (Quinta-feira)",
          origin: "Lisboa (LIS)",
          destination: "Toulouse-Blagnac (TLS)"
        },
        inbound: {
          code: "FR1799",
          airline: "Ryanair",
          departure: "TLS 22:30",
          arrival: "LIS 23:35",
          date: "04/10/2026 (Domingo)",
          origin: "Toulouse-Blagnac (TLS)",
          destination: "Lisboa (LIS)"
        }
      },
      accommodation: {
        name: "Hotel Mercure Toulouse Centre Wilson Capitole",
        address: "7 Rue Labeda, 31000 Toulouse",
        regime: "APA (Pequeno-almoço incluído)",
        checkIn: "01/10 a partir das 15:00",
        checkOut: "04/10 até às 12:00",
        phone: "+33 5 34 45 40 40"
      },
      mainMeetingPoint: {
        name: "Ponto de Encontro dos Tours",
        address: "29 Allée Jean Jaurès, 31000 Toulouse",
        notes: "Local exato de partida dos autocarros para Carcassonne, Albi e Cordes-sur-Ciel."
      }
    };

    const ITINERARY_DAYS = [
      {
        day: 1,
        date: "01 Out 2026",
        title: "Chegada & Primeiro Olhar sobre Toulouse",
        subtitle: "Aterragem, Transfer e Jantar na Place du Capitole",
        tag: "Chegada",
        color: "bg-amber-500",
        events: [
          { id: "e1-1", time: "17:00 - 19:50", title: "Voo Lisboa (LIS) ➔ Toulouse (TLS)", location: "Aeroporto TLS", desc: "Voo Ryanair FR1798. Chegada prevista às 19:50 hora local." },
          { id: "e1-2", time: "20:15 - 20:45", title: "Transfer Navette Aéroport ➔ Jean Jaurès", location: "Estação Jean Jaurès", desc: "Apanhar Navette no aeroporto (9,00 €). Saída na paragem Jean Jaurès." },
          { id: "e1-3", time: "20:55", title: "Check-in no Hotel Mercure Capitole", location: "7 Rue Labeda", desc: "Instalação nos quartos. O hotel fica a 5 min a pé de Jean Jaurès." },
          { id: "e1-4", time: "21:30 - 23:00", title: "Jantar Rápido & Passeio Noturno", location: "Place du Capitole", desc: "Jantar na famosa praça iluminada da Cidade Rosa e passeio a pé suave." }
        ]
      },
      {
        day: 2,
        date: "02 Out 2026",
        title: "Excursão à Cité de Carcassonne",
        subtitle: "Cidadela Medieval, Cassoulet e Pôr do Sol no Rio Garonne",
        tag: "Carcassonne",
        color: "bg-rose-600",
        events: [
          { id: "e2-1", time: "09:15", title: "Encontro para a Excursão", location: "29 All. Jean Jaurès", desc: "Comparência no ponto de partida com calçado confortável para empedrado." },
          { id: "e2-2", time: "09:30 - 10:45", title: "Viagem em Autocarro para Carcassonne", location: "Autocarro (75 min)", desc: "Trajeto cénico pela região de Occitânia." },
          { id: "e2-3", time: "10:45 - 14:30", title: "Visita Cité de Carcassonne & Château Comtal", location: "Carcassonne", desc: "3h45m livres para explorar muralhas medievais, Castelo Comtal e almoço de Cassoulet." },
          { id: "e2-4", time: "14:30 - 15:45", title: "Regresso a Toulouse", location: "Autocarro para Jean Jaurès", desc: "Chegada prevista às 15:45." },
          { id: "e2-5", time: "16:30 - 19:00", title: "Passeio Rio Garonne & Pont Neuf", location: "Pont Neuf & Quais de la Daurade", desc: "Caminhada relaxante à beira do rio, fotografia ao pôr do sol." },
          { id: "e2-6", time: "20:00", title: "Jantar no Le Breughel", location: "Le Breughel", desc: "Restaurante típico de bistro acolhedor com excelente qualidade/preço." }
        ]
      },
      {
        day: 3,
        date: "03 Out 2026",
        title: "Albi & Cordes-sur-Ciel",
        subtitle: "Património UNESCO da Tijola Vermelha e Vila Medieval nas Nuvens",
        tag: "Albi & Cordes",
        color: "bg-purple-600",
        events: [
          { id: "e3-1", time: "09:15", title: "Encontro para a Excursão Albi & Cordes", location: "29 All. Jean Jaurès", desc: "Embarque no autocarro pontual às 09:30." },
          { id: "e3-2", time: "09:30 - 10:30", title: "Autocarro Toulouse ➔ Albi", location: "Autocarro (1h)", desc: "Chegada a Albi, a monumental cidade episcopal." },
          { id: "e3-3", time: "10:30 - 14:30", title: "Exploração de Albi & Almoço", location: "Catedral Sainte-Cécile", desc: "Visita à incrível Catedral fortificada de tijola. Almoço na Crêperie du Garric." },
          { id: "e3-4", time: "14:30 - 15:00", title: "Autocarro Albi ➔ Cordes-sur-Ciel", location: "Autocarro (30 min)", desc: "Subida até à fascinante vila medieval no cimo da colina." },
          { id: "e3-5", time: "15:00 - 17:30", title: "Visita a Cordes-sur-Ciel", location: "Vila Medieval (2.5h)", desc: "Ruas empedradas, artesanato local e vistas panorâmicas." },
          { id: "e3-6", time: "17:30 - 18:30", title: "Regresso a Toulouse", location: "Autocarro ➔ Jean Jaurès", desc: "Chegada a Toulouse por volta das 18:30." },
          { id: "e3-7", time: "20:00", title: "Jantar na Place Saint-Georges", location: "Place Saint-Georges", desc: "Jantar numa das praças mais acolhedoras de Toulouse." }
        ]
      },
      {
        day: 4,
        date: "04 Out 2026",
        title: "Coração de Toulouse & Regresso a Lisboa",
        subtitle: "Mercado Victor Hugo, Monumentos, Compras e Voo de Regresso",
        tag: "Toulouse & Regresso",
        color: "bg-emerald-600",
        events: [
          { id: "e4-1", time: "09:30 - 11:30", title: "Marché Victor Hugo & Basílica Saint-Sernin", location: "Centro Histórico", desc: "Visita ao mercado gastronómico e à maior basílica românica da Europa." },
          { id: "e4-2", time: "11:30 - 12:30", title: "Couvent des Jacobins", location: "Rue Lapeyrouse", desc: "Admirar a célebre 'Palmeira' de pilares medievais." },
          { id: "e4-3", time: "12:30 - 14:00", title: "Almoço Típico no 1º Andar do Mercado Victor Hugo", location: "Marché Victor Hugo", desc: "Especialidades ultra frescas grelhadas na hora." },
          { id: "e4-4", time: "14:30 - 18:30", title: "Compras Rue Saint-Rome & Canal du Midi", location: "Rue Saint-Rome & Canal", desc: "Últimas compras de lembranças e passeio pelo canal." },
          { id: "e4-5", time: "20:00", title: "Navette de Regresso ao Aeroporto", location: "Paragem Jean Jaurès", desc: "Embarque na Navette para o Aeroporto TLS." },
          { id: "e4-6", time: "22:30 - 23:35", title: "Voo Toulouse (TLS) ➔ Lisboa (LIS)", location: "Voo Ryanair FR1799", desc: "Partida às 22:30 TLS. Aterragem às 23:35 em Lisboa." }
        ]
      }
    ];

    const RESTAURANTS_DATA = [
      { name: "Marché Victor Hugo (1º Andar)", price: "€€ (15-25€)", type: "Mercado & Marisco / Carnes", specialty: "Prato do dia fresco, Entrecôte, Magret de Canard", tip: "Vá por volta das 12:15 para apanhar mesa." },
      { name: "Le Breughel", price: "€€ (18-28€)", type: "Bistro Francês Tradicional", specialty: "Cassoulet maison, Confit de Canard, Tarte Tatin", tip: "Excelente cassoulet servido em terrina de barro." },
      { name: "La Trivalle (Carcassonne)", price: "€€ (16-24€)", type: "Comida de Carcassonne", specialty: "Cassoulet de Carcassonne, Vinhos Minervois", tip: "Preços muito mais económicos que dentro da cidadela!" },
      { name: "Crêperie du Garric (Albi)", price: "€ (10-18€)", type: "Creperia & Galettes", specialty: "Galette de Trigo Sarraceno com Queijo Roquefort", tip: "Acompanhe com uma taça de cidra artesanal." }
    ];

    function App() {
      const [activeTab, setActiveTab] = React.useState('dashboard');
      const [selectedDay, setSelectedDay] = React.useState(1);
      const [completedEvents, setCompletedEvents] = React.useState({});

      const toggleEventCheck = (id) => {
        setCompletedEvents(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const currentDayObj = ITINERARY_DAYS.find(d => d.day === selectedDay);

      return e('div', { className: 'min-h-screen pb-20 md:pb-8' },
        // Header Principal
        e('header', { className: 'bg-slate-900 border-b border-slate-800 p-4 md:px-8 shadow-lg' },
          e('div', { className: 'max-w-6xl mx-auto flex justify-between items-center' },
            e('div', { className: 'flex items-center space-x-3' },
              e('div', { className: 'w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-amber-500 flex items-center justify-center font-bold text-white shadow-md' }, '✈️'),
              e('div', null,
                e('h1', { className: 'font-bold text-lg md:text-xl text-white' }, TRIP_METADATA.title),
                e('p', { className: 'text-xs text-rose-400 font-medium' }, TRIP_METADATA.subtitle)
              )
            ),
            e('span', { className: 'text-xs font-semibold px-3 py-1 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30' }, '01-04 Outubro 2026')
          )
        ),

        // Navegação Desktop / Tabs
        e('div', { className: 'bg-slate-900/60 border-b border-slate-800 sticky top-0 z-20 backdrop-blur-md' },
          e('div', { className: 'max-w-6xl mx-auto flex space-x-2 p-2 overflow-x-auto' },
            [
              { id: 'dashboard', label: '⚡ Resumo & Voo' },
              { id: 'itinerary', label: '📅 Itinerário 4 Dias' },
              { id: 'food', label: '🍷 Gastronomia & Dicas' }
            ].map(tab => 
              e('button', {
                key: tab.id,
                onClick: () => setActiveTab(tab.id),
                className: `px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                  activeTab === tab.id
                    ? 'bg-rose-500 text-white shadow-md'
                    : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                }`
              }, tab.label)
            )
          )
        ),

        // Conteúdo Principal
        e('main', { className: 'max-w-6xl mx-auto p-4 md:p-6 space-y-6' },
          
          // TAB: DASHBOARD
          activeTab === 'dashboard' && e('div', { className: 'space-y-6' },
            e('div', { className: 'rounded-3xl bg-gradient-to-r from-rose-900/50 via-purple-900/40 to-slate-900 p-6 border border-rose-500/30 shadow-xl' },
              e('h2', { className: 'text-2xl font-extrabold text-white mb-2' }, 'Viagem Confirmada a Toulouse & Occitânia'),
              e('p', { className: 'text-xs md:text-sm text-slate-300 max-w-2xl' }, 
                '4 dias inesquecíveis a explorar a Cidade Rosa, as muralhas de Carcassonne, o património de Albi e as ruazinhas de Cordes-sur-Ciel.'
              )
            ),

            e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
              // Cartão Voo Ida
              e('div', { className: 'bg-slate-900 border border-slate-800 p-5 rounded-2xl' },
                e('div', { className: 'flex justify-between items-center mb-3' },
                  e('span', { className: 'text-xs font-bold text-blue-400 uppercase tracking-wider' }, '✈️ Voo de Ida'),
                  e('span', { className: 'text-xs text-slate-400' }, TRIP_METADATA.flights.outbound.date)
                ),
                e('h3', { className: 'text-lg font-bold text-white' }, `${TRIP_METADATA.flights.outbound.code} • ${TRIP_METADATA.flights.outbound.airline}`),
                e('div', { className: 'flex justify-between items-center mt-3 pt-3 border-t border-slate-800 text-sm' },
                  e('div', null, e('p', { className: 'font-extrabold text-white' }, TRIP_METADATA.flights.outbound.departure), e('p', { className: 'text-xs text-slate-400' }, TRIP_METADATA.flights.outbound.origin)),
                  e('span', { className: 'text-xs text-emerald-400 font-semibold' }, '➔ Direto ➔'),
                  e('div', { className: 'text-right' }, e('p', { className: 'font-extrabold text-white' }, TRIP_METADATA.flights.outbound.arrival), e('p', { className: 'text-xs text-slate-400' }, TRIP_METADATA.flights.outbound.destination))
                )
              ),

              // Cartão Voo Regresso
              e('div', { className: 'bg-slate-900 border border-slate-800 p-5 rounded-2xl' },
                e('div', { className: 'flex justify-between items-center mb-3' },
                  e('span', { className: 'text-xs font-bold text-amber-400 uppercase tracking-wider' }, '✈️ Voo de Regresso'),
                  e('span', { className: 'text-xs text-slate-400' }, TRIP_METADATA.flights.inbound.date)
                ),
                e('h3', { className: 'text-lg font-bold text-white' }, `${TRIP_METADATA.flights.inbound.code} • ${TRIP_METADATA.flights.inbound.airline}`),
                e('div', { className: 'flex justify-between items-center mt-3 pt-3 border-t border-slate-800 text-sm' },
                  e('div', null, e('p', { className: 'font-extrabold text-white' }, TRIP_METADATA.flights.inbound.departure), e('p', { className: 'text-xs text-slate-400' }, TRIP_METADATA.flights.inbound.origin)),
                  e('span', { className: 'text-xs text-emerald-400 font-semibold' }, '➔ Direto ➔'),
                  e('div', { className: 'text-right' }, e('p', { className: 'font-extrabold text-white' }, TRIP_METADATA.flights.inbound.arrival), e('p', { className: 'text-xs text-slate-400' }, TRIP_METADATA.flights.inbound.destination))
                )
              )
            ),

            e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
              // Hotel
              e('div', { className: 'bg-slate-900 border border-slate-800 p-5 rounded-2xl' },
                e('span', { className: 'text-xs font-bold text-purple-400 uppercase tracking-wider block mb-1' }, '🏨 Alojamento'),
                e('h4', { className: 'font-bold text-white text-base' }, TRIP_METADATA.accommodation.name),
                e('p', { className: 'text-xs text-slate-300 mt-2' }, `📍 ${TRIP_METADATA.accommodation.address}`),
                e('p', { className: 'text-xs text-emerald-400 mt-1 font-semibold' }, `🍳 ${TRIP_METADATA.accommodation.regime}`),
                e('p', { className: 'text-xs text-slate-400 mt-1' }, `📞 ${TRIP_METADATA.accommodation.phone}`)
              ),

              // Ponto de Encontro Excursões
              e('div', { className: 'bg-slate-900 border border-rose-500/40 p-5 rounded-2xl' },
                e('span', { className: 'text-xs font-bold text-rose-400 uppercase tracking-wider block mb-1' }, '📍 Ponto de Partida dos Tours'),
                e('h4', { className: 'font-bold text-white text-base' }, TRIP_METADATA.mainMeetingPoint.name),
                e('p', { className: 'text-xs text-rose-300 font-semibold mt-2' }, TRIP_METADATA.mainMeetingPoint.address),
                e('p', { className: 'text-xs text-slate-400 mt-1' }, TRIP_METADATA.mainMeetingPoint.notes),
                e('p', { className: 'text-xs text-amber-400 mt-2 font-bold' }, '⏰ Estar no local sempre às 09:15 nos dias de excursão!')
              )
            )
          ),

          // TAB: ITINERARIO
          activeTab === 'itinerary' && e('div', { className: 'space-y-6' },
            e('div', { className: 'flex space-x-2 overflow-x-auto pb-2' },
              ITINERARY_DAYS.map(day => 
                e('button', {
                  key: day.day,
                  onClick: () => setSelectedDay(day.day),
                  className: `px-4 py-2.5 rounded-xl text-xs font-bold transition flex flex-col items-center ${
                    selectedDay === day.day
                      ? 'bg-rose-500 text-white shadow-lg shadow-rose-500/30'
                      : 'bg-slate-900 text-slate-400 hover:bg-slate-800 border border-slate-800'
                  }`
                },
                  e('span', null, `Dia ${day.day}`),
                  e('span', { className: 'text-[10px] opacity-80' }, day.date.split(' ')[0] + ' Out')
                )
              )
            ),

            e('div', { className: 'bg-slate-900 border border-slate-800 p-5 rounded-2xl' },
              e('span', { className: `inline-block px-2.5 py-0.5 rounded text-[11px] font-bold text-white mb-2 ${currentDayObj.color}` }, currentDayObj.tag),
              e('h3', { className: 'text-lg font-bold text-white' }, currentDayObj.title),
              e('p', { className: 'text-xs text-slate-400' }, currentDayObj.subtitle)
            ),

            e('div', { className: 'space-y-3' },
              currentDayObj.events.map(event => {
                const isChecked = completedEvents[event.id];
                return e('div', {
                  key: event.id,
                  onClick: () => toggleEventCheck(event.id),
                  className: `p-4 rounded-2xl border transition cursor-pointer flex items-start space-x-3.5 ${
                    isChecked ? 'bg-slate-900/40 border-slate-800 opacity-50' : 'bg-slate-900 border-slate-800 hover:border-slate-700'
                  }`
                },
                  e('div', { className: `w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold mt-0.5 flex-shrink-0 border ${
                    isChecked ? 'bg-emerald-500 border-emerald-400 text-white' : 'border-slate-700 text-slate-500'
                  }` }, isChecked ? '✓' : ''),
                  e('div', { className: 'flex-1' },
                    e('div', { className: 'flex justify-between items-center mb-1' },
                      e('span', { className: 'text-xs font-mono font-bold text-rose-400 bg-slate-800 px-2 py-0.5 rounded' }, event.time),
                      e('span', { className: 'text-[11px] text-slate-400 font-medium' }, `📍 ${event.location}`)
                    ),
                    e('h4', { className: `text-sm font-bold ${isChecked ? 'line-through text-slate-400' : 'text-white'}` }, event.title),
                    e('p', { className: 'text-xs text-slate-300 mt-1' }, event.desc)
                  )
                );
              })
            )
          ),

          // TAB: GASTRONOMIA
          activeTab === 'food' && e('div', { className: 'space-y-6' },
            e('h2', { className: 'text-xl font-bold text-white' }, '🍷 Gastronomia & Dicas Recomendadas'),
            
            e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
              RESTAURANTS_DATA.map((resto, idx) => 
                e('div', { key: idx, className: 'bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-2' },
                  e('div', { className: 'flex justify-between items-start' },
                    e('h3', { className: 'font-bold text-white text-base' }, resto.name),
                    e('span', { className: 'text-xs font-mono font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' }, resto.price)
                  ),
                  e('p', { className: 'text-xs text-slate-400 font-medium' }, resto.type),
                  e('div', { className: 'bg-slate-950 p-3 rounded-xl text-xs space-y-1 text-slate-300 border border-slate-800' },
                    e('p', null, e('strong', { className: 'text-slate-400' }, 'Prato: '), resto.specialty),
                    e('p', { className: 'text-amber-300' }, e('strong', { className: 'text-amber-400' }, 'Dica: '), resto.tip)
                  )
                )
              )
            ),

            e('div', { className: 'bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3' },
              e('h3', { className: 'text-sm font-bold text-rose-400 uppercase tracking-wider' }, '💡 Dica da Água Grátis em França'),
              e('p', { className: 'text-xs text-slate-300 leading-relaxed' }, 
                'Por lei em França, a água da torneira em restaurantes é 100% gratuita! Para pedir uma jarra de água grátis na refeição diga ao empregado: ',
                e('span', { className: 'font-bold text-amber-300 italic' }, '"Une carafe d\'eau, s\'il vous plaît"'),
                ' (pronuncia-se: Iun caraf d\'ô, sil vu plé).'
              )
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
