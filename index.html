    function App() {

      const [isTripStarted, setIsTripStarted] = useState(false);
      
      const [chatMessages, setChatMessages] = useState([
        {
          sender: 'ai',
          text: 'Bonjour! Sou o vosso Toulouse AI Guide 2026. Como posso ajudar na vossa viagem a Toulouse, Carcassonne e Albi?'
        }
      ]);
      const [inputMessage, setInputMessage] = useState('');
      const [isTyping, setIsTyping] = useState(false);

      useEffect(() => {
        const calculateCountdown = () => {
          const tripDate = new Date(TRIP_METADATA.startDate).getTime();
          const now = new Date().getTime();
          const difference = tripDate - now;

          if (difference <= 0) {
            setIsTripStarted(true);
            setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0 });
          } else {
            setIsTripStarted(false);
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);
            setTimeLeft({ days, hours, minutes, seconds });
          }
        };

        calculateCountdown();
        const timer = setInterval(calculateCountdown, 1000);
        return () => clearInterval(timer);
      }, []);

      const toggleEventCheck = (id) => {
        setCompletedEvents(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const handleSendMessage = async (textToSend) => {
        const query = textToSend || inputMessage;
        if (!query.trim()) return;

        const userMsg = { sender: 'user', text: query };
        setChatMessages(prev => [...prev, userMsg]);
        if (!textToSend) setInputMessage('');
        setIsTyping(true);

        setTimeout(async () => {
          let responseText = "";

          try {
            const systemPrompt = `És o 'Toulouse AI Guide 2026', um assistente de viagens amigável e especialista na região de Occitânia, Toulouse, Carcassonne e Albi. O utilizador viaja de 1 a 4 de Outubro de 2026 com o voo Ryanair LIS-TLS e fica no Hotel Mercure Wilson Capitole. Dá respostas úteis, diretas e com tom acolhedor em Português.`;
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`;
            
            const res = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: query }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
              })
            });

            if (res.ok) {
              const data = await res.json();
              responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            }
          } catch (err) {}

          if (!responseText) {
            const lower = query.toLowerCase();
            const found = AI_KNOWLEDGE_BASE.find(item => 
              item.keywords.some(kw => lower.includes(kw))
            );

            if (found) {
              responseText = found.answer;
            } else {
              responseText = `Tenho todas as informações do vosso itinerário para 1-4 de Outubro de 2026! Pode perguntar-me sobre transportes do aeroporto, restaurante em Carcassonne, pontos de encontro para as excursões às 09:15 ou vocabulário útil em francês.`;
            }
          }

          setChatMessages(prev => [...prev, { sender: 'ai', text: responseText }]);
          setIsTyping(false);
        }, 800);
      };

                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden relative shadow-2xl h-[420px] md:h-[500px] flex flex-col md:flex-row">
                  <div className="flex-1 bg-slate-950 relative overflow-hidden flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:24px_24px] opacity-30" />

                    <div className="absolute top-4 left-4 z-10 bg-slate-900/90 backdrop-blur border border-slate-800 px-3 py-2 rounded-xl text-xs text-slate-300">
                      <span className="font-bold text-white block">Região da Occitânia</span>
                      <span>Toulouse • Carcassonne • Albi</span>
                    </div>

                    <div className="relative w-full h-full max-w-lg mx-auto flex flex-wrap content-center justify-center gap-3 p-4 z-10 overflow-y-auto">
                      {filteredPlaces.map((place) => (
                        <button
                          key={place.id}
                          onClick={() => setSelectedPlace(place)}
                          className={`p-3 rounded-2xl border text-left transition transform hover:scale-105 ${
                            selectedPlace?.id === place.id
                              ? 'bg-slate-800 border-white ring-2 ring-rose-500 shadow-xl'
                              : 'bg-slate-900/90 border-slate-800 hover:border-slate-700'
                          }`}
                        >
                          <div className="flex items-center space-x-2">
                            <div 
                              className="w-3.5 h-3.5 rounded-full flex-shrink-0" 
                              style={{ backgroundColor: place.color }} 
                            />
                            <span className="font-bold text-xs text-white truncate max-w-[140px]">{place.name}</span>
                          </div>
                          <p className="text-[10px] text-slate-400 mt-1 line-clamp-1">{place.address}</p>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="w-full md:w-80 bg-slate-900 border-t md:border-t-0 md:border-l border-slate-800 p-5 flex flex-col justify-between">
                    {selectedPlace ? (
                      <div>
                        <div className="flex items-center space-x-2 mb-2">
                          <span 
                            className="w-3 h-3 rounded-full" 
                            style={{ backgroundColor: selectedPlace.color }} 
                          />
                          <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                            {selectedPlace.category}
                          </span>
                        </div>
                        <h3 className="text-lg font-bold text-white mb-1">{selectedPlace.name}</h3>
                        <p className="text-xs text-slate-400 mb-3 flex items-start gap-1">
                          <MapPin className="w-3.5 h-3.5 text-rose-400 flex-shrink-0 mt-0.5" />
                          <span>{selectedPlace.address}</span>
                        </p>

                        <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800/80 mb-4">
                          <p className="text-xs text-slate-300 leading-relaxed">{selectedPlace.desc}</p>
                        </div>

                        <a
                          href={`https://maps.google.com/?q=${encodeURIComponent(selectedPlace.name + " " + selectedPlace.address)}`}
                          target="_blank"
                          rel="noreferrer"
                          className="w-full flex items-center justify-center space-x-2 py-2.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-semibold text-xs transition shadow-lg shadow-rose-500/20"
                        >
                          <Navigation className="w-4 h-4" />
                          <span>Como Chegar (Google Maps)</span>
                        </a>
                      </div>
                    ) : (
                      <div className="h-full flex flex-col items-center justify-center text-center p-4">
                        <MapPin className="w-10 h-10 text-slate-700 mb-2 animate-bounce" />
                        <p className="text-xs text-slate-400 font-medium">Clique num marcador do mapa para ver detalhes e direções.</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'food' && (
              <div className="space-y-6 animate-fadeIn">
                <div>
                  <h2 className="text-2xl font-bold text-white">Guia Gastronómico & Dicas Locais</h2>
                  <p className="text-xs text-slate-400">Restaurantes selecionados para comer bem sem gastar muito e regras de ouro para a viagem.</p>
                </div>

                <div className="space-y-3">
                  <h3 className="text-sm font-bold text-rose-400 uppercase tracking-wider flex items-center gap-2">
                    <AlertCircle className="w-4 h-4" /> Dicas Rápidas de Sobrevivência
                  </h3>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {SURVIVAL_TIPS.map((tip, idx) => {
                      const TipIcon = tip.icon;
                      return (
                        <div key={idx} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-start space-x-3.5">
                          <div className="p-2.5 rounded-xl bg-slate-800 text-rose-400 flex-shrink-0">
                            <TipIcon className="w-5 h-5" />
                          </div>
                          <div>
                            <div className="flex items-center space-x-2 mb-1">
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${tip.badgeBg}`}>
                                {tip.category}
                              </span>
                            </div>
                            <h4 className="font-bold text-sm text-white">{tip.title}</h4>
                            <p className="text-xs text-slate-300 mt-1 leading-relaxed">{tip.desc}</p>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="space-y-3 pt-4">
                  <h3 className="text-sm font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-2">
                    <Utensils className="w-4 h-4" /> Restaurantes Económicos Recomendados
                  </h3>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {RESTAURANTS_DATA.map((resto, idx) => (
                      <div key={idx} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between hover:border-slate-700 transition">
                        <div>
                          <div className="flex justify-between items-start mb-2">
                            <h4 className="font-bold text-base text-white">{resto.name}</h4>
                            <span className="text-xs font-mono font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                              {resto.price}
                            </span>
                          </div>
                          <p className="text-xs text-slate-400 font-medium mb-3">{resto.type}</p>

                          <div className="space-y-1.5 text-xs text-slate-300 bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                            <p><strong className="text-slate-400">Especialidade:</strong> {resto.specialty}</p>
                            <p className="text-amber-300"><strong className="text-amber-400">Dica:</strong> {resto.tip}</p>
                          </div>
                        </div>

                        <div className="mt-4 pt-3 border-t border-slate-800 text-xs text-slate-400 flex items-center justify-between">
                          <span className="flex items-center gap-1">
                            <MapPin className="w-3.5 h-3.5 text-slate-500" /> {resto.address}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'ai' && (
              <div className="space-y-4 animate-fadeIn flex flex-col h-[calc(100vh-140px)] max-h-[700px]">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <Bot className="w-6 h-6 text-purple-400" /> Toulouse AI Concierge
                    </h2>
                    <p className="text-xs text-slate-400">Assistente virtual em tempo real para dúvidas sobre a viagem e traduções.</p>
                  </div>
                </div>

                <div className="flex items-center gap-2 overflow-x-auto pb-1">
                  <button 
                    onClick={() => handleSendMessage("Onde comer um Cassoulet barato?")}
                    className="px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 hover:border-purple-500/50 text-slate-300 text-xs font-medium whitespace-nowrap transition flex items-center gap-1.5"
                  >
                    <Sparkles className="w-3.5 h-3.5 text-purple-400" /> Onde comer Cassoulet barato?
                  </button>

                  <button 
                    onClick={() => handleSendMessage("Como pedir uma garrafa de água em francês?")}
                    className="px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 hover:border-purple-500/50 text-slate-300 text-xs font-medium whitespace-nowrap transition flex items-center gap-1.5"
                  >
                    <Coffee className="w-3.5 h-3.5 text-emerald-400" /> Pedir água em francês?
                  </button>

                  <button 
                    onClick={() => handleSendMessage("Qual o caminho para a paragem do autocarro do aeroporto?")}
                    className="px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 hover:border-purple-500/50 text-slate-300 text-xs font-medium whitespace-nowrap transition flex items-center gap-1.5"
                  >
                    <Bus className="w-3.5 h-3.5 text-amber-400" /> Autocarro do aeroporto?
                  </button>
                </div>

                <div className="flex-1 bg-slate-900 border border-slate-800 rounded-2xl p-4 overflow-y-auto space-y-3 flex flex-col">
                  {chatMessages.map((msg, idx) => (
                    <div 
                      key={idx} 
                      className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}
                    >
                      <div className={`max-w-[85%] md:max-w-[75%] p-3.5 rounded-2xl text-xs leading-relaxed ${
                        msg.sender === 'user'
                          ? 'bg-rose-500 text-white rounded-br-none'
                          : 'bg-slate-800 text-slate-200 border border-slate-700/60 rounded-bl-none shadow'
                      }`}>
                        {msg.text}
                      </div>
                    </div>
                  ))}

                  {isTyping && (
                    <div className="flex justify-start">
                      <div className="bg-slate-800 border border-slate-700 p-3 rounded-2xl rounded-bl-none text-xs text-slate-400 flex items-center space-x-2">
                        <span className="w-2 h-2 rounded-full bg-purple-400 animate-pulse" />
                        <span>Toulouse AI está a pensar...</span>
                      </div>
                    </div>
                  )}
                </div>

                <div className="flex items-center space-x-2">
                  <input
                    type="text"
                    value={inputMessage}
                    onChange={(e) => setInputMessage(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                    placeholder="Pergunta sobre a viagem ou tradução em francês..."
                    className="flex-1 bg-slate-900 border border-slate-800 text-white placeholder-slate-500 text-xs rounded-xl px-4 py-3 focus:outline-none focus:border-purple-500/80"
                  />
                  <button
                    onClick={() => handleSendMessage()}
                    className="p-3 bg-purple-600 hover:bg-purple-500 text-white rounded-xl transition shadow-lg shadow-purple-600/30"
                  >
                    <Send className="w-4 h-4" />
                  </button>
                </div>
              </div>
            )}
          </main>

          <div className="md:hidden fixed bottom-0 left-0 right-0 bg-slate-950/95 backdrop-blur-md border-t border-slate-800 px-2 py-2 flex justify-around items-center z-50">
            <button
              onClick={() => setActiveTab('dashboard')}
              className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${
                activeTab === 'dashboard' ? 'text-amber-400' : 'text-slate-500'
              }`}
            >
              <Sparkles className="w-5 h-5" />
              <span className="text-[10px] font-medium mt-1">Home</span>
            </button>

            <button
              onClick={() => setActiveTab('itinerary')}
              className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${
                activeTab === 'itinerary' ? 'text-rose-400' : 'text-slate-500'
              }`}
            >
              <Calendar className="w-5 h-5" />
              <span className="text-[10px] font-medium mt-1">4 Dias</span>
            </button>

            <button
              onClick={() => setActiveTab('map')}
              className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${
                activeTab === 'map' ? 'text-blue-400' : 'text-slate-500'
              }`}
            >
              <MapPin className="w-5 h-5" />
              <span className="text-[10px] font-medium mt-1">Mapa</span>
            </button>

            <button
              onClick={() => setActiveTab('food')}
              className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${
                activeTab === 'food' ? 'text-emerald-400' : 'text-slate-500'
              }`}
            >
              <Utensils className="w-5 h-5" />
              <span className="text-[10px] font-medium mt-1">Dicas</span>
            </button>

            <button
              onClick={() => setActiveTab('ai')}
              className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${
                activeTab === 'ai' ? 'text-purple-400' : 'text-slate-500'
              }`}
            >
              <Bot className="w-5 h-5" />
              <span className="text-[10px] font-medium mt-1">IA Guide</span>
            </button>
          </div>
        </div>
      );
    }

    // Renderização do App React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
